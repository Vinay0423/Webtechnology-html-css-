<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Loops</h1>
    <script>
        let arr=[12,33,42]

        //for loop
        for(let i=0;i<arr.length;i++){
            console.log(i,arr[i]);
        }

        //for-in loop : gives the indexes
        for(let item in arr){
            console.log(item,' indexes');
        }

        //for-of loop: gives the values
        for(let item of arr){
            console.log(item, ' values ');
        }

        //for-each loop: gives both index and values

        arr.forEach((value,index) => console.log(index, value));

    </script>
</body>
</html>
