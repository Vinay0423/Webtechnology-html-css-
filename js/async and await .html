<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Async and await </h1>

    <script>
        
        async function fetchData(){

            try{
            let res= await fetch("https://api.apis.guru/v2/list.json")
            const data= await res.json()
            return data
            }
            catch(err){
console.log(err);
            }
        }

        fetchData().then((result) => {
            console.log(result);
        }).catch((err) => {
            console.log(err);
        });


        function demo(){
            console.log('hello');
        }

        setTimeout(demo,2000)
    </script>
</body>
</html>
