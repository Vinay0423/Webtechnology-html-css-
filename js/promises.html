<!DOCTYPE html>
<html lang="en">

  <body>
    <h1>Promises</h1>

    <script>
      console.log("hiii");
      console.log("hello");
      let promise = new Promise((resolve, reject) => {
        let a = 1;
        if (a == 1) {
          resolve("success");
        } else {
          reject("failed");
        }
      });

    //   console.log(promise, typeof promise);

      promise
        .then((e) => {
          console.log(e);
        })
        .catch((error) => {
          console.log(error);
        });


        
        let promise1 = new Promise((resolve, reject) => {
    
        setTimeout(() => {
            reject("success")    // only the first executed settimeout executes, promises is fulfilled/rejected after any settimeout executes so no further set timout
        },1000);

        setTimeout(() => {
            reject("failure")
        }, 2000);
      });
    </script>
  </body>
